name: Daily Data Update

on:
  schedule:
    # 09:00 UTC = 17:00 Beijing time (CST), after market close at 15:15
    - cron: '0 9 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Pipeline takes ~20-30 min for T+TL full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update cache + run full pipeline + refresh README
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/update_data.py --mode full

      - name: Commit and push all updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/ results/figures/ results/tables/ results/report.md README.md
          git diff --staged --quiet || git commit -m "chore: daily data + results update $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
          git push
