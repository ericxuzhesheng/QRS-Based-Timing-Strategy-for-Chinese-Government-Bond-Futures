name: Daily Tushare Data Update

on:
  schedule:
    # 09:00 UTC = 17:00 Beijing time (CST), after market close at 15:15
    # Weekdays only (Mon-Fri) to avoid holiday/weekend API waste
    - cron: '0 9 * * 1-5'
  workflow_dispatch:  # Manual trigger for testing / forced refresh

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update data from Tushare
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python scripts/update_data.py --contract ALL --mode cache-only

      - name: Commit and push updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          git diff --staged --quiet || git commit -m "chore: daily data update $(date +'%Y-%m-%d')"
          git push
